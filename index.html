<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon AI Snake - TikTok LIVE Edition</title>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: #12131c;
            --panel-border: rgba(0, 243, 255, 0.2);
            --neon-green: #00ff66;
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-gold: #ffd700;
            --neon-purple: #9d00ff;
            --text-color: #c5c6c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        /* --- GAME SECTION --- */
        .game-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
            border: 2px solid var(--panel-border);
            position: relative;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 450px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .stat-val {
            display: block;
            font-size: 1.1rem;
            margin-top: 2px;
        }

        .val-cyan { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }
        .val-green { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }
        .val-pink { color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); }
        .val-gold { color: var(--neon-gold); text-shadow: 0 0 8px var(--neon-gold); }
        .val-purple { color: var(--neon-purple); text-shadow: 0 0 8px var(--neon-purple); }

        /* Hunger Bar */
        .hunger-container {
            width: 100%;
            max-width: 450px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            height: 20px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .hunger-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff0055, var(--neon-green));
            transition: width 0.2s linear;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .hunger-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 4px #000;
        }

        .canvas-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }

        canvas {
            background-color: #030305;
            border: 3px solid var(--neon-cyan);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            display: block;
            transition: border-color 0.5s ease;
        }

        /* Banner Overlay for Announcements */
        .banner {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--neon-gold);
            padding: 15px 30px;
            border-radius: 12px;
            color: var(--neon-gold);
            font-size: 1.5rem;
            font-weight: 900;
            text-align: center;
            text-shadow: 0 0 15px var(--neon-gold);
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            z-index: 5;
            white-space: nowrap;
        }

        .banner.show {
            transform: translate(-50%, -50%) scale(1);
        }

        /* Game Over Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .game-over-title {
            font-size: 2.2rem;
            color: var(--neon-pink);
            text-shadow: 0 0 15px var(--neon-pink);
            margin-bottom: 10px;
            font-weight: 900;
        }

        .win-title {
            color: var(--neon-gold);
            text-shadow: 0 0 20px var(--neon-gold);
        }

        .end-stats {
            margin: 15px 0;
            line-height: 1.8;
            font-size: 1rem;
            color: #fff;
        }

        .btn-restart {
            margin-top: 15px;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #000;
            background: var(--neon-green);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-green);
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-restart:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px var(--neon-green);
        }

        /* --- DASHBOARD & STREAM CONTROLS --- */
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 320px;
        }

        .panel {
            background: var(--panel-bg);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .panel h2 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8892b0;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }

        .gift-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-gift {
            background: #08090d;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: all 0.2s ease;
        }

        .btn-gift:hover {
            border-color: var(--neon-cyan);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 243, 255, 0.2);
        }

        .btn-gift span { font-size: 1.2rem; }
        .btn-gift small { font-size: 0.7rem; color: #8892b0; }

        /* Color accents for gift buttons */
        .btn-gift[data-gift="rose"]:hover { border-color: #ff3366; }
        .btn-gift[data-gift="heart"]:hover { border-color: var(--neon-pink); }
        .btn-gift[data-gift="lion"]:hover { border-color: var(--neon-gold); }
        .btn-gift[data-gift="universe"]:hover { border-color: var(--neon-purple); }

        /* Event Log */
        .event-log {
            height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .event-log::-webkit-scrollbar { width: 4px; }
        .event-log::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        .log-entry {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            border-left: 3px solid var(--neon-cyan);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Game Section -->
        <div class="game-section">
            <div class="stats-grid">
                <div class="stat-box">LENGTH <span id="snake-len" class="stat-val val-cyan">3</span></div>
                <div class="stat-box">APPLES <span id="apple-count" class="stat-val val-pink">0</span></div>
                <div class="stat-box">SCORE <span id="score" class="stat-val val-green">0</span></div>
            </div>

            <div class="stats-grid" style="grid-template-columns: 1fr 1fr; max-width: 450px;">
                <div class="stat-box">TOTAL GIFTS <span id="total-gifts" class="stat-val val-gold">€0.00</span></div>
                <div class="stat-box">HIGH SCORE <span id="high-score" class="stat-val val-purple">0</span></div>
            </div>

            <!-- Hunger Bar -->
            <div class="hunger-container">
                <div id="hunger-bar" class="hunger-bar"></div>
                <div id="hunger-text" class="hunger-text">HUNGER: 30.0s</div>
            </div>

            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="400" height="400"></canvas>
                
                <!-- Overlay Banner for Special Events -->
                <div id="banner" class="banner"></div>

                <!-- Game Over / Victory Overlay -->
                <div id="overlay" class="overlay">
                    <div id="overlay-title" class="game-over-title">GAME OVER</div>
                    <div id="end-stats" class="end-stats"></div>
                    <button class="btn-restart" onclick="resetGame()">RESTART GAME</button>
                </div>
            </div>
        </div>

        <!-- Dashboard / Stream Controls Section -->
        <div class="dashboard">
            <!-- Test Controls -->
            <div class="panel">
                <h2>Test Controls</h2>
                <div class="gift-grid">
                    <button class="btn-gift" data-gift="rose" onclick="handleGift('rose', 0.10)">
                        <span>🌹</span> Rose
                        <small>+1 Apple (€0.10)</small>
                    </button>
                    <button class="btn-gift" data-gift="heart" onclick="handleGift('heart', 1.00)">
                        <span>❤️</span> Heart
                        <small>+3 Apples (€1.00)</small>
                    </button>
                    <button class="btn-gift" data-gift="lion" onclick="handleGift('lion', 10.00)">
                        <span>🦁</span> Lion
                        <small>+10 Apples (€10.00)</small>
                    </button>
                    <button class="btn-gift" data-gift="universe" onclick="handleGift('universe', 25.00)">
                        <span>🌌</span> Universe
                        <small>+25 Apples (€25.00)</small>
                    </button>
                </div>
            </div>

            <!-- Event Log -->
            <div class="panel">
                <h2>Live Event Log</h2>
                <div id="eventLog" class="event-log"></div>
            </div>
        </div>
    </div>

    <script>
        // --- CONSTANTS & SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Dynamic Grid Configurations
        let gridSize = 12; // Start small (12x12)
        const CANVAS_PIXEL_SIZE = 400;
        let tileSize = CANVAS_PIXEL_SIZE / gridSize;

        const MAX_HUNGER = 30.0; // 30 seconds
        const BASE_TICK_RATE = 140; // Base speed in ms per move

        // --- GAME STATE VARIABLES ---
        let snake = [];
        let secondSnake = []; // For Double Snake event (€25)
        let apples = [];
        let score = 0;
        let totalGiftValue = 0.00;
        let hunger = MAX_HUNGER;
        let highScore = localStorage.getItem('ai_snake_highscore') || 0;
        
        let isGameOver = false;
        let gameLoopTimeout = null;
        let hungerInterval = null;
        let deathReason = "";

        // Event Flags (Unlocked once per milestone)
        let milestones = {
            speedBoost: false,  // €5
            goldenApples: false,// €10
            doubleSnake: false, // €25
            superMode: false,   // €50
            chaosMode: false    // €100
        };

        let unlockedEventsList = [];

        // UI References
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const snakeLenEl = document.getElementById('snake-len');
        const appleCountEl = document.getElementById('apple-count');
        const totalGiftsEl = document.getElementById('total-gifts');
        const hungerBarEl = document.getElementById('hunger-bar');
        const hungerTextEl = document.getElementById('hunger-text');
        const overlayEl = document.getElementById('overlay');
        const overlayTitleEl = document.getElementById('overlay-title');
        const endStatsEl = document.getElementById('end-stats');
        const bannerEl = document.getElementById('banner');
        const logEl = document.getElementById('eventLog');

        highScoreEl.textContent = highScore;

        // --- GAME INITIALIZATION & RESET ---
        function resetGame() {
            gridSize = 12;
            updateGridSize(gridSize);

            snake = [
                { x: 3, y: 6 },
                { x: 2, y: 6 },
                { x: 1, y: 6 }
            ];
            
            secondSnake = [];
            apples = [];
            score = 0;
            totalGiftValue = 0.00;
            hunger = MAX_HUNGER;
            isGameOver = false;
            deathReason = "";

            milestones = {
                speedBoost: false,
                goldenApples: false,
                doubleSnake: false,
                superMode: false,
                chaosMode: false
            };
            unlockedEventsList = [];

            updateUI();
            overlayEl.classList.remove('active');
            canvas.style.borderColor = "var(--neon-cyan)";

            // Start Timers
            if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
            if (hungerInterval) clearInterval(hungerInterval);

            hungerInterval = setInterval(updateHunger, 100);
            gameLoop();
        }

        function updateGridSize(newSize) {
            gridSize = newSize;
            tileSize = CANVAS_PIXEL_SIZE / gridSize;
        }

        // --- DYNAMIC GRID EXPANSION ---
        function checkGridGrowth() {
            let targetSize = 12;
            const len = snake.length;

            if (len >= 200) targetSize = 36;
            else if (len >= 100) targetSize = 30;
            else if (len >= 50) targetSize = 24;
            else if (len >= 30) targetSize = 20;
            else if (len >= 15) targetSize = 16;

            if (targetSize !== gridSize) {
                updateGridSize(targetSize);
                logEvent(`📐 Spielfeld erweitert auf ${gridSize}x${gridSize}!`, "#00f3ff");
            }
        }

        // --- GAME LOOP ---
        function gameLoop() {
            if (isGameOver) return;

            // Check if Snake completely fills grid
            if (snake.length >= gridSize * gridSize) {
                triggerWin();
                return;
            }

            // Move Primary AI Snake
            const nextPos = getNextAiMove(snake[0], snake);
            if (!nextPos) {
                // Trap state / self-collision
                endGame("SELF-COLLISION / TRAPPED");
                return;
            }

            snake.unshift(nextPos);

            // Check if Snake ate an apple
            let ateApple = false;
            for (let i = apples.length - 1; i >= 0; i--) {
                if (snake[0].x === apples[i].x && snake[0].y === apples[i].y) {
                    apples.splice(i, 1);
                    ateApple = true;
                    
                    // Reward
                    const pts = milestones.goldenApples ? 30 : 10;
                    score += pts;
                    hunger = MAX_HUNGER; // Reset hunger timer
                    break;
                }
            }

            if (!ateApple) {
                snake.pop(); // Remove tail segment if no apple eaten
            } else {
                checkGridGrowth();
            }

            // Move Second Snake if unlocked
            if (milestones.doubleSnake && secondSnake.length > 0) {
                const nextPos2 = getNextAiMove(secondSnake[0], secondSnake);
                if (nextPos2) {
                    secondSnake.unshift(nextPos2);
                    secondSnake.pop();
                }
            }

            // Check Highscore
            if (score > highScore) {
                highScore = score;
                highScoreEl.textContent = highScore;
                localStorage.setItem('ai_snake_highscore', highScore);
            }

            updateUI();
            draw();

            // Calculate tick delay based on milestones
            let delay = BASE_TICK_RATE;
            if (milestones.chaosMode) delay = 50;
            else if (milestones.superMode) delay = 70;
            else if (milestones.speedBoost) delay = 100;

            gameLoopTimeout = setTimeout(gameLoop, delay);
        }

        // --- BFS PATHFINDING AI ---
        function getNextAiMove(head, currentBody) {
            // Find closest reachable apple
            let targetApple = findClosestReachableApple(head, currentBody);

            if (targetApple) {
                let path = findPathBFS(head, targetApple, currentBody);
                if (path && path.length > 1) {
                    return path[1]; // Move towards target
                }
            }

            // Safe fallback move if no path to apple exists
            return getSafeFallbackMove(head, currentBody);
        }

        function findClosestReachableApple(head, body) {
            let closest = null;
            let minDistance = Infinity;

            for (let apple of apples) {
                let dist = Math.abs(head.x - apple.x) + Math.abs(head.y - apple.y);
                if (dist < minDistance) {
                    // Check if path actually exists
                    let path = findPathBFS(head, apple, body);
                    if (path) {
                        minDistance = dist;
                        closest = apple;
                    }
                }
            }
            return closest;
        }

        function findPathBFS(start, target, body) {
            let queue = [[start]];
            let visited = Array.from({ length: gridSize }, () => Array(gridSize).fill(false));
            
            // Mark snake body as wall (except tail which moves away)
            for (let i = 0; i < body.length - 1; i++) {
                let seg = body[i];
                if (seg.x >= 0 && seg.x < gridSize && seg.y >= 0 && seg.y < gridSize) {
                    visited[seg.y][seg.x] = true;
                }
            }

            const directions = [
                { x: 0, y: -1 }, { x: 1, y: 0 },
                { x: 0, y: 1 },  { x: -1, y: 0 }
            ];

            while (queue.length > 0) {
                let path = queue.shift();
                let current = path[path.length - 1];

                if (current.x === target.x && current.y === target.y) {
                    return path;
                }

                for (let dir of directions) {
                    let nextX = current.x + dir.x;
                    let nextY = current.y + dir.y;

                    if (nextX >= 0 && nextX < gridSize && nextY >= 0 && nextY < gridSize) {
                        if (!visited[nextY][nextX]) {
                            visited[nextY][nextX] = true;
                            queue.push([...path, { x: nextX, y: nextY }]);
                        }
                    }
                }
            }
            return null; // No path found
        }

        function getSafeFallbackMove(head, body) {
            const directions = [
                { x: 0, y: -1 }, { x: 1, y: 0 },
                { x: 0, y: 1 },  { x: -1, y: 0 }
            ];

            let safeMoves = [];

            for (let dir of directions) {
                let nx = head.x + dir.x;
                let ny = head.y + dir.y;

                if (nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize) {
                    // Check collision with snake body
                    let collides = body.some(seg => seg.x === nx && seg.y === ny);
                    if (!collides) {
                        safeMoves.push({ x: nx, y: ny });
                    }
                }
            }

            if (safeMoves.length === 0) return null; // Fully trapped

            // Choose the safe move with the most open space around it
            safeMoves.sort((a, b) => countFreeNeighbors(b, body) - countFreeNeighbors(a, body));
            return safeMoves[0];
        }

        function countFreeNeighbors(pos, body) {
            const directions = [{ x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }];
            let count = 0;
            for (let dir of directions) {
                let nx = pos.x + dir.x;
                let ny = pos.y + dir.y;
                if (nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize) {
                    if (!body.some(seg => seg.x === nx && seg.y === ny)) count++;
                }
            }
            return count;
        }

        // --- HUNGER SYSTEM ---
        function updateHunger() {
            if (isGameOver) return;

            hunger -= 0.1;
            if (hunger <= 0) {
                hunger = 0;
                endGame("SNAKE STARVED");
            }

            const pct = (hunger / MAX_HUNGER) * 100;
            hungerBarEl.style.width = pct + "%";
            hungerTextEl.textContent = `HUNGER: ${hunger.toFixed(1)}s`;

            if (pct < 25) {
                hungerBarEl.style.background = "#ff0000";
            } else {
                hungerBarEl.style.background = "linear-gradient(90deg, #ff0055, var(--neon-green))";
            }
        }

        // --- PUBLIC EXPOSED GIFT SYSTEM ---
        function spawnApple() {
            let validPos = false;
            let newApple = { x: 0, y: 0 };
            let maxAttempts = 150;

            while (!validPos && maxAttempts > 0) {
                maxAttempts--;
                newApple = {
                    x: Math.floor(Math.random() * gridSize),
                    y: Math.floor(Math.random() * gridSize)
                };

                const onSnake = snake.some(s => s.x === newApple.x && s.y === newApple.y);
                const onSnake2 = secondSnake.some(s => s.x === newApple.x && s.y === newApple.y);
                const onApple = apples.some(a => a.x === newApple.x && a.y === newApple.y);

                if (!onSnake && !onSnake2 && !onApple) {
                    validPos = true;
                }
            }

            if (validPos) {
                apples.push(newApple);
            }
        }

        function handleGift(giftName, value = 0.50) {
            if (isGameOver) return;

            let appleCount = 1;
            let logText = "";
            let color = "#00f3ff";

            switch (giftName.toLowerCase()) {
                case 'rose':
                    appleCount = 1;
                    logText = "🌹 Rose → +1 Apple";
                    color = "#ff3366";
                    break;
                case 'heart':
                    appleCount = 3;
                    logText = "❤️ Heart → +3 Apples";
                    color = "#ff007f";
                    break;
                case 'lion':
                    appleCount = 10;
                    logText = "🦁 Lion → +10 Apples";
                    color = "#ffd700";
                    break;
                case 'universe':
                    appleCount = 25;
                    logText = "🌌 Universe → +25 Apples";
                    color = "#9d00ff";
                    break;
            }

            // Register gift & total value
            totalGiftValue += value;
            logEvent(logText, color);

            // Spawn apples
            for (let i = 0; i < appleCount; i++) {
                spawnApple();
            }

            // Flash overlay banner
            showBanner(logText);

            // Check milestone unlocks
            checkMilestones();
            updateUI();
        }

        function checkMilestones() {
            if (totalGiftValue >= 100 && !milestones.chaosMode) {
                milestones.chaosMode = true;
                unlockedEventsList.push("💀 CHAOS MODE");
                logEvent("💀 CHAOS MODE ACTIVATED 💀", "#ff0055");
                showBanner("💀 CHAOS MODE ACTIVATED 💀");
                canvas.style.borderColor = "#ff0055";
            }
            else if (totalGiftValue >= 50 && !milestones.superMode) {
                milestones.superMode = true;
                unlockedEventsList.push("🔥 SUPER MODE");
                logEvent("🔥 SUPER MODE ACTIVATED 🔥", "#ffd700");
                showBanner("🔥 SUPER MODE ACTIVATED 🔥");
                canvas.style.borderColor = "#ffd700";
            }
            else if (totalGiftValue >= 25 && !milestones.doubleSnake) {
                milestones.doubleSnake = true;
                unlockedEventsList.push("🐍 DOUBLE SNAKE");
                logEvent("🐍 DOUBLE SNAKE ACTIVATED!", "#9d00ff");
                showBanner("🐍 DOUBLE SNAKE UNLOCKED!");
                
                // Initialize second decorative snake
                secondSnake = [
                    { x: gridSize - 2, y: gridSize - 2 },
                    { x: gridSize - 2, y: gridSize - 3 }
                ];
            }
            else if (totalGiftValue >= 10 && !milestones.goldenApples) {
                milestones.goldenApples = true;
                unlockedEventsList.push("⭐ GOLDEN APPLES");
                logEvent("⭐ GOLDEN APPLES UNLOCKED!", "#ffd700");
                showBanner("⭐ GOLDEN APPLES UNLOCKED!");
            }
            else if (totalGiftValue >= 5 && !milestones.speedBoost) {
                milestones.speedBoost = true;
                unlockedEventsList.push("⚡ SPEED BOOST");
                logEvent("⚡ SPEED BOOST ACTIVATED!", "#00f3ff");
                showBanner("⚡ SPEED BOOST ACTIVATED!");
            }
        }

        // --- UI & LOGGING ---
        function updateUI() {
            snakeLenEl.textContent = snake.length;
            appleCountEl.textContent = apples.length;
            scoreEl.textContent = score;
            totalGiftsEl.textContent = `€${totalGiftValue.toFixed(2)}`;
        }

        function logEvent(text, color) {
            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.borderLeftColor = color;
            entry.textContent = `[${timestamp}] ${text}`;

            logEl.prepend(entry);
        }

        function showBanner(text) {
            bannerEl.textContent = text;
            bannerEl.classList.add('show');
            setTimeout(() => {
                bannerEl.classList.remove('show');
            }, 1800);
        }

        // --- RENDER GAME ---
        function draw() {
            // Clear Background
            ctx.fillStyle = '#030305';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Dynamic Grid Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += tileSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw Main Snake
            snake.forEach((seg, index) => {
                const isHead = index === 0;
                
                if (milestones.superMode || milestones.chaosMode) {
                    ctx.fillStyle = isHead ? '#ffffff' : '#ffd700';
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = isHead ? 15 : 8;
                } else {
                    ctx.fillStyle = isHead ? '#00f3ff' : '#00ff66';
                    ctx.shadowColor = isHead ? '#00f3ff' : '#00ff66';
                    ctx.shadowBlur = isHead ? 10 : 4;
                }

                ctx.beginPath();
                ctx.roundRect(
                    seg.x * tileSize + 1,
                    seg.y * tileSize + 1,
                    tileSize - 2,
                    tileSize - 2,
                    isHead ? 5 : 2
                );
                ctx.fill();
            });

            // Draw Second Snake (if unlocked)
            if (milestones.doubleSnake && secondSnake.length > 0) {
                secondSnake.forEach((seg, index) => {
                    ctx.fillStyle = index === 0 ? '#ff007f' : '#9d00ff';
                    ctx.shadowColor = '#ff007f';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.roundRect(seg.x * tileSize + 1, seg.y * tileSize + 1, tileSize - 2, tileSize - 2, 3);
                    ctx.fill();
                });
            }

            // Draw Apples
            apples.forEach(apple => {
                if (milestones.goldenApples || milestones.superMode || milestones.chaosMode) {
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 12;
                } else {
                    ctx.fillStyle = '#ff007f';
                    ctx.shadowColor = '#ff007f';
                    ctx.shadowBlur = 8;
                }

                ctx.beginPath();
                ctx.arc(
                    apple.x * tileSize + tileSize / 2,
                    apple.y * tileSize + tileSize / 2,
                    (tileSize / 2) - 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            });

            // Reset glow effect
            ctx.shadowBlur = 0;
        }

        // --- END GAME & WIN STATES ---
        function endGame(reason) {
            isGameOver = true;
            deathReason = reason;
            clearInterval(hungerInterval);
            if (gameLoopTimeout) clearTimeout(gameLoopTimeout);

            overlayTitleEl.textContent = reason === "SNAKE STARVED" ? "VERHUNGERT!" : "GAME OVER";
            overlayTitleEl.classList.remove('win-title');

            endStatsEl.innerHTML = `
                <strong>Länge:</strong> ${snake.length}<br>
                <strong>Score:</strong> ${score}<br>
                <strong>Gifts Gesamt:</strong> €${totalGiftValue.toFixed(2)}<br>
                <strong>Events:</strong> ${unlockedEventsList.length > 0 ? unlockedEventsList.join(', ') : 'Keine'}
            `;
            overlayEl.classList.add('active');
        }

        function triggerWin() {
            isGameOver = true;
            clearInterval(hungerInterval);
            if (gameLoopTimeout) clearTimeout(gameLoopTimeout);

            overlayTitleEl.textContent = "🐍 SNAKE FILLED THE ENTIRE ROOM! 🐍";
            overlayTitleEl.classList.add('win-title');

            endStatsEl.innerHTML = `
                <h3 style="color:var(--neon-green); margin-bottom:10px;">THE LIVE IS OVER</h3>
                <strong>Finale Länge:</strong> ${snake.length}<br>
                <strong>Score:</strong> ${score}<br>
                <strong>Total Gifts:</strong> €${totalGiftValue.toFixed(2)}<br>
                <strong>Events Unlocked:</strong> ${unlockedEventsList.join(', ')}
            `;
            overlayEl.classList.add('active');
        }

        // Start game on window load
        resetGame();
    </script>
